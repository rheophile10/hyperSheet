# Deploys the plastron demo to GitHub Pages on every push to master.
# Landing page = the ORIGIN host (the north-star starting point: 元 in
# freespace — type formulas, grow an app, "a system of cels. interlinked.").
# The full plastron-OS demo is kept reachable at /os/. Both are single
# self-contained index.html files, rebuilt from source each run (never
# commit dist/).
#
# Configure once: Settings → Pages → Source: "GitHub Actions".

name: Deploy plastron demo to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install kernel deps
        working-directory: plastron-simple
        run: bun install --frozen-lockfile || bun install

      - name: Build kernel (tsc → dist/)
        working-directory: plastron-simple
        run: bun run build

      - name: Bundle origin host (landing page)
        working-directory: plastron-simple-examples/origin
        run: bun bundle.ts

      - name: Bundle plastron-OS (full demo)
        working-directory: plastron-simple-examples/plastron-os
        run: bun bundle.ts

      - name: Assemble deploy dir (origin at /, OS at /os/)
        run: |
          mkdir -p deploy/os
          cp plastron-simple-examples/origin/dist/index.html deploy/index.html
          cp plastron-simple-examples/plastron-os/dist/index.html deploy/os/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
