<!doctype html>
<!-- Source for the Open Graph / Twitter card (card.png). Render with:
     google-chrome --headless --screenshot=card.png --window-size=1200,630 card.html -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      * { margin: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; }
      body {
        background: radial-gradient(130% 130% at 82% 8%, #262e36 0%, #14171a 68%);
        color: #f2f4f6;
        font: 400 28px/1.4 system-ui, "Segoe UI", sans-serif;
        display: flex; flex-direction: column; justify-content: center;
        padding: 86px; position: relative; overflow: hidden;
      }
      /* faint spreadsheet cell grid */
      .grid {
        position: absolute; inset: 0; opacity: .055;
        background-image:
          linear-gradient(#fff 1px, transparent 1px),
          linear-gradient(90deg, #fff 1px, transparent 1px);
        background-size: 84px 84px;
      }
      .turtle { font-size: 156px; line-height: 1; }
      h1 { font-size: 108px; font-weight: 700; letter-spacing: -3px; margin: .06em 0 0; }
      .yuan { color: #88d3a0; }
      p { font-size: 38px; color: #9aa4af; margin-top: .35em; }
      .url {
        position: absolute; bottom: 66px; left: 86px;
        font: 30px ui-monospace, "SFMono-Regular", monospace; color: #6f7b86;
      }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="turtle">🐢</div>
    <h1>plastron <span class="yuan">元</span></h1>
    <p>cels interlinked</p>
    <div class="url">plastron.ca</div>
  </body>
</html>
