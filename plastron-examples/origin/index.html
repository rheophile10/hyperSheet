<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Agent/LLM hints near the top of <head> — <meta> survives render-extraction
         (a hidden <div> does not), and /llms.txt is the full plain-text guide. -->
    <meta name="description" content="plastron — a reactive spreadsheet of cels in one index.html. Encrypted share-links: AES-256-GCM (#aes256gcm=) and unconditional one-time pad (#otp=). Full agent guide as plain text → https://plastron.ca/llms.txt" />
    <meta name="plastron:guide" content="https://plastron.ca/llms.txt" />
    <meta name="plastron:examples" content="otp, aes256gcm, cels, files, sql, secrets, charts" />
    <!-- Network-governance Layer 6: CSP is the HARD enforcement under the net
         gate. connect-src pins outbound destinations (a compromised CDN script
         can't fetch arbitrary hosts); script-src omits 'unsafe-eval' so formula
         codegen can't run new Function — the engine's AST-walk fallback (gated
         on csp.eval-available) takes over. 'wasm-unsafe-eval' keeps the wasm
         compilers (js/quickjs/py) working; CDNs pinned for Pyodide/confetti.
         Pyodide package WHEELS (numpy, opencv-python, pillow, mpmath — loaded
         on demand by py cells that import them, e.g. the ChaosEdgeSteg doc)
         fetch from the same cdn.jsdelivr.net origin already in connect-src, so
         no widening is needed. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; connect-src 'self' blob: data: https://api.anthropic.com https://api.x.ai https://api.open-meteo.com https://geocoding-api.open-meteo.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com ws://localhost:* wss://localhost:* http://localhost:* http://127.0.0.1:* ws://127.0.0.1:* https://*.supabase.co wss://*.supabase.co; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; worker-src 'self' blob:;" />
    <title>🐢 plastron — cels interlinked</title>
    <!-- Open Graph / Twitter card (static; crawlers don't run JS or see the #f= hash,
         so every shared link previews with this one 🐢 card — card.png is rendered
         from card.html and copied to the site root by the Pages workflow). -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="🐢 plastron 甲骨 — cels interlinked" />
    <meta property="og:description" content="open a reactive plastron made entirely of cels" />
    <meta property="og:url" content="https://plastron.ca/" />
    <meta property="og:image" content="https://plastron.ca/card.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="🐢 plastron 甲骨" />
    <meta name="twitter:description" content="cels interlinked" />
    <meta name="twitter:image" content="https://plastron.ca/card.png" />
    <!-- LLM/agent guide as plain text — the #llms div is buried ~2/3 through this
         ~2.9 MB single-file bundle and is visually hidden, so fetch tools truncate
         or strip it. /llms.txt is the reliable channel: small, text/plain. -->
    <link rel="alternate" type="text/plain" title="plastron — LLM guide" href="/llms.txt" />
    <!--LLMS_HEAD-->
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      /* body grows to fit its widest content (a wide canvas / grid), with a
         100% floor — so anything mounted is reachable via horizontal scroll
         instead of being clipped off-screen. */
      body { margin: 0; font: 15px/1.5 system-ui, sans-serif; width: max-content; min-width: 100%; }
      /* no padding: the .origin desktop is FLUSH to the viewport, so a window's
         geom(x,y,w,h) maps to true viewport coordinates (geom(0,0,1,1) fills it).
         Windows carry their own margins via geom(); fixed overlays (wallpaper /
         navpanel) are viewport-relative regardless. */
      #app { min-height: 100vh; padding: 0; }
      /* Everything else — the sheet, grids, cells, the readme — carries its
         OWN styling inline, produced by the origin view fn + readme formula.
         The host keeps only this base shell (:root / * / body / #app).
         (The 🎹 keyboard's keycap styling — incl. the :active press colour —
         lives in the keyboard document itself, mounted as a <style> via dom("style",…).) */
    </style>
  </head>
  <body>
    <div id="app"></div>
    <!-- llms.txt, in a CSS-invisible <div id="llms">: ordinary DOM content (NOT a
         <noscript> — some agents/extractors, e.g. Grok, drop noscript) so crawlers,
         fetch-tools and LLMs read it, while the sr-only/clip style keeps it off-
         screen for real users running the app. The verb catalog under "FULL VERB
         CATALOG" is the plain-text output of =vocab(), baked in by the Pages build
         (bundle.ts) — so "discover with formulas" is also "it's already here as text". -->
    <div id="llms" aria-hidden="true" style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);border:0">
      <pre style="white-space:pre-wrap;font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace">
[[LLMS_GUIDE]]
</pre>
    </div>
    <!-- The baked origin-application archives (apps/*.json + apps/docs/*.json): a { name: segment-archive }
         map the first boot's boot.run installs into OPFS (store.put, NOT state); the
         desktop shell is then hydrated on demand. The install source of truth. -->
    <script type="application/json" id="plastron-apps">[[APP_ARCHIVES]]</script>
    <!-- The build stamp + release notice ({id, notice}): id is a content hash of the
         baked archives + UPDATE.md, so any shipped change mints a new id. Boot's
         origin.updateCheck compares it to the persisted last-seen id and surfaces
         the desktop 🔄 update chip on mismatch. Inert JSON, like #plastron-apps. -->
    <script type="application/json" id="plastron-update">[[UPDATE_INFO]]</script>
    <!-- No external <script> tags: the py-compiler pulls Pyodide from a CDN
         itself (via the kernel loadScript primitive) on first py use. -->
    <script type="module" src="./origin-main.ts"></script>
  </body>
</html>
