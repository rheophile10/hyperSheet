<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Network-governance Layer 6: CSP is the HARD enforcement under the net
         gate. connect-src pins outbound destinations (a compromised CDN script
         can't fetch arbitrary hosts); script-src omits 'unsafe-eval' so formula
         codegen can't run new Function — the engine's AST-walk fallback (gated
         on csp.eval-available) takes over. 'wasm-unsafe-eval' keeps the wasm
         compilers (js/quickjs/py) working; CDNs pinned for Pyodide/confetti. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; connect-src 'self' blob: data: https://api.anthropic.com https://api.x.ai https://api.open-meteo.com https://geocoding-api.open-meteo.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com ws://localhost:* wss://localhost:*; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; worker-src 'self' blob:;" />
    <title>元 — plastron origin</title>
    <!-- Open Graph / Twitter card (static; crawlers don't run JS or see the #f= hash,
         so every shared link previews with this one 🐢 card — card.png is rendered
         from card.html and copied to the site root by the Pages workflow). -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="🐢 plastron 元 — a spreadsheet that is its own app" />
    <meta property="og:description" content="open a reactive plastron made entirely of cels" />
    <meta property="og:url" content="https://plastron.ca/" />
    <meta property="og:image" content="https://plastron.ca/card.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="🐢 plastron 元" />
    <meta name="twitter:description" content="a spreadsheet that is its own app — made of cels" />
    <meta name="twitter:image" content="https://plastron.ca/card.png" />
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      /* body grows to fit its widest content (a wide canvas / grid), with a
         100% floor — so anything mounted is reachable via horizontal scroll
         instead of being clipped off-screen. */
      body { margin: 0; font: 15px/1.5 system-ui, sans-serif; width: max-content; min-width: 100%; }
      #app { min-height: 100vh; padding: 2rem; }
      /* Everything else — the sheet, grids, cells, the readme — carries its
         OWN styling inline, produced by the origin view fn + readme formula.
         The host keeps only this base shell (:root / * / body / #app). */
    </style>
  </head>
  <body>
    <div id="app"></div>
    <a href="./os/" style="position:fixed;bottom:.6rem;right:.8rem;font-size:.75rem;opacity:.5;color:inherit">plastron-os ↗</a>
    <!-- No external <script> tags: the py-compiler pulls Pyodide from a CDN
         itself (via the kernel loadScript primitive) on first py use. -->
    <script type="module" src="./origin-main.ts"></script>
  </body>
</html>
