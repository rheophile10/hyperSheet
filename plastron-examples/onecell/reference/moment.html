<script language=javascript>
function scriptPick(name)
{
  console.log("scriptPick(" + name + ")");
  let names = name.split('.');
  let ext = names.length > 1 ? names[names.length-1] : '';
  name = names[0];
  window.loadScript('cells/' + name + (ext===''?'':'.') + ext, (nm) => {
      if( typeof nm != 'undefined' ) {
        if( ext === 'bin' ) {
          scriptPick(name + ".json");
        } else if( ext === "json" ) {
          alert("I am sorry: I couldn't download " + name + " - are you ssure the path is right? It may have been removed - try one of these.");
        } else {
          scriptPick(name + ".json");
        }
      } else {
        document.getElementById('loading_3').style.display = 'none';
        f.style.display = 'none';
      }
    });
}

function selectScript(name)
{
  let f = document.getElementById('sourcehelp');

  if( typeof name == 'undefined' ) {
    f.style.display='none';
    window.startupOneCell();
  } else {
    f.style.display='none';
    scriptPick(name);
  }
}

function sleighbell()
{
  selectScript('oddcell');
}
window.onload = function(){
    let sh = document.getElementById('sourcehelp');
    if( window.matchMedia("(any-pointer:coarse)").matches > 0 ) {
      document.body.style.fontSize = '28pt';
      if( sh )
        sh.style.fontSize = '24pt';
    }
    document.getElementById('loading_1').style.display='none';

    selectScript();
};

</script>
