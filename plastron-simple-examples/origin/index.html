<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>元 — plastron origin</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      /* body grows to fit its widest content (a wide canvas / grid), with a
         100% floor — so anything mounted is reachable via horizontal scroll
         instead of being clipped off-screen. */
      body { margin: 0; font: 15px/1.5 system-ui, sans-serif; width: max-content; min-width: 100%; }
      #app { min-height: 100vh; padding: 2rem; }
      .origin { display: flex; flex-direction: column; gap: 1.25rem; align-items: center; margin: 0 auto; }
      .sheet { display: flex; flex-direction: column; gap: 1.25rem; align-items: center; }
      .grid-scroll { overflow-x: auto; max-width: 100%; }

      .readme { margin: 0; white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: .82rem; }
      .readme h2 { margin: 0 0 .4rem; font-size: 1.05rem; }
      .readme p { margin: .1rem 0; white-space: pre-wrap; }

      /* Excel-style grid for grid() layers */
      table.grid { border-collapse: collapse; font-variant-numeric: tabular-nums; }
      table.grid th, table.grid td {
        border: 1px solid #8883; padding: 0; min-width: 4.5rem; height: 1.9rem;
        text-align: left; vertical-align: middle;
      }
      table.grid thead th, table.grid .rownum {
        background: #8881; text-align: center; color: #888; font-weight: 600; font-size: .8rem;
        font-family: ui-monospace, monospace; min-width: 1.8rem; padding: 0 .35rem;
      }
      table.grid th.corner { color: #aaa; font-weight: 700; }
      table.grid td.cell { cursor: cell; }
      table.grid td.cell:hover { background: #8881; }
      table.grid td.cell.editing { outline: 2px solid #4a90d9; outline-offset: -2px; }

      /* the base sheet (元): its lone cell autofits its content and expands —
         roomy, wraps, grows with what you type/compute, never the tiny grid box */
      table.grid.base td.cell.base {
        min-width: 22rem; max-width: 70rem; height: auto; vertical-align: top; white-space: normal;
      }
      td.cell.base .cell-value { min-height: 2.4rem; align-items: stretch; }
      td.cell.base .cell-value > :first-child { white-space: normal; overflow: visible; text-overflow: clip; }

      /* cell internals */
      .cell-value { display: flex; align-items: flex-start; gap: .25rem; padding: .15rem .4rem; min-height: 1.6rem; font-family: ui-monospace, monospace; font-size: .85rem; }
      .cell-value > :first-child { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .cell-value { cursor: text; }
      .cell-pre { margin: 0; white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: .8rem; line-height: 1.4; }
      /* a multi-line value renders formatted in place (beats the grid-cell
         one-line clip rule above) */
      .cell-value > pre.cell-pre { white-space: pre-wrap; overflow: visible; text-overflow: clip; }
      .cell-editing { display: flex; flex-direction: column; gap: .2rem; }
      .cell-error { color: #d4453e; background: #d4453e1a; font-family: ui-monospace, monospace; font-size: .76rem; padding: .15rem .45rem; border-radius: .3rem; }
      .cell-edit { width: 100%; font: inherit; font-family: ui-monospace, monospace; font-size: .85rem; padding: .15rem .4rem; border: 0; background: #4a90d922; }
      /* the base cell's editor: a resizable textarea so long formulas expand */
      textarea.cell-edit.big { min-width: 22rem; min-height: 3rem; resize: both; white-space: pre-wrap; line-height: 1.4; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <a href="./os/" style="position:fixed;bottom:.6rem;right:.8rem;font-size:.75rem;opacity:.5;color:inherit">plastron-os ↗</a>
    <!-- No external <script> tags: the py-compiler pulls Pyodide from a CDN
         itself (via the kernel loadScript primitive) on first py use. -->
    <script type="module" src="./origin-main.ts"></script>
  </body>
</html>
