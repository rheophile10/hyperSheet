<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>元 — plastron origin</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body { margin: 0; font: 15px/1.5 system-ui, sans-serif; }
      #app { min-height: 100vh; padding: 2rem; }
      .origin { display: flex; flex-direction: column; gap: 1.25rem; align-items: center; margin: 0 auto; max-width: 100%; }
      .region { display: flex; flex-direction: column; gap: .75rem; align-items: center; }
      .region:empty { display: none; }
      .sheet { display: flex; flex-direction: column; gap: 1.25rem; align-items: start; }
      .grid-scroll { overflow-x: auto; max-width: 100%; }

      /* the 元 button — the base sheet's A1 */
      .cell.zhorigin {
        border: 1px solid #8884; border-radius: .6rem; background: #8881;
        min-width: 16rem; max-width: 44rem; overflow: hidden;
      }
      .cell.zhorigin .cell-label {
        font-weight: 700; color: #888; font-family: ui-monospace, monospace;
        padding: .35rem .7rem; cursor: pointer; border-bottom: 1px solid #8883; background: #8881;
      }
      .cell.zhorigin .cell-label:hover { background: #8883; }
      .cell.zhorigin .cell-value { padding: .6rem .8rem; }
      .readme { margin: 0; white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: .82rem; }
      .readme h2 { margin: 0 0 .4rem; font-size: 1.05rem; }
      .readme p { margin: .1rem 0; white-space: pre-wrap; }

      /* Excel-style grid for grid() layers */
      table.grid { border-collapse: collapse; font-variant-numeric: tabular-nums; }
      table.grid th, table.grid td {
        border: 1px solid #8883; padding: 0; min-width: 4.5rem; height: 1.9rem;
        text-align: left; vertical-align: middle;
      }
      table.grid thead th, table.grid .rownum {
        background: #8881; text-align: center; color: #888; font-weight: 600; font-size: .8rem;
        font-family: ui-monospace, monospace; min-width: 1.8rem; padding: 0 .35rem;
      }
      table.grid th.corner { color: #aaa; font-weight: 700; }
      table.grid td.cell { cursor: cell; }
      table.grid td.cell:hover { background: #8881; }
      table.grid td.cell.editing { outline: 2px solid #4a90d9; outline-offset: -2px; }

      /* cell internals */
      .cell-value { display: flex; align-items: center; gap: .25rem; padding: .15rem .4rem; min-height: 1.6rem; font-family: ui-monospace, monospace; font-size: .85rem; }
      .cell-value > :first-child { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .cell-expand {
        opacity: .55; border: 1px solid #8884; border-radius: .35rem; background: #8882;
        cursor: pointer; color: inherit; font-size: 1rem; line-height: 1; padding: .1rem .35rem; flex: none;
      }
      .cell:hover .cell-expand, .cell.zhorigin:hover .cell-expand { opacity: .9; }
      .cell-expand:hover { opacity: 1; background: #4a90d944; }
      .cell-pre { margin: 0; white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: .8rem; line-height: 1.4; }
      /* a multi-line value renders formatted in place (beats the grid-cell
         one-line clip rule below) */
      .cell-value > pre.cell-pre { white-space: pre-wrap; overflow: visible; text-overflow: clip; }
      .cell-edit { width: 100%; font: inherit; font-family: ui-monospace, monospace; font-size: .85rem; padding: .15rem .4rem; border: 0; background: #4a90d922; }
      .cell-edit.big { min-height: 10rem; resize: vertical; }

      /* expanded formula panel — a centered overlay, visible regardless of scroll */
      .expand-panel {
        position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 100;
        border: 1px solid #4a90d9aa; border-radius: .6rem; background: Canvas;
        box-shadow: 0 .5rem 2rem #0006; width: 48rem; max-width: 92vw; max-height: 80vh; overflow: auto;
      }
      .expand-head { display: flex; justify-content: space-between; align-items: center; padding: .35rem .7rem; background: #4a90d922; font-family: ui-monospace, monospace; font-weight: 700; color: #888; }
      .expand-close { border: 0; background: transparent; cursor: pointer; font-size: 1.1rem; color: #888; }
      .expand-panel .cell-edit.big { display: block; }
      .expand-value { padding: .5rem .8rem; border-top: 1px solid #8883; font-family: ui-monospace, monospace; font-size: .85rem; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <a href="./os/" style="position:fixed;bottom:.6rem;right:.8rem;font-size:.75rem;opacity:.5;color:inherit">plastron-os ↗</a>
    <script type="module" src="./origin-main.ts"></script>
  </body>
</html>
