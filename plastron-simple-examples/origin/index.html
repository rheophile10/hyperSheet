<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>元 — plastron origin</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body { margin: 0; font: 15px/1.5 system-ui, sans-serif; }
      #app { min-height: 100vh; display: grid; place-items: center; padding: 2rem; }
      .origin-root { display: flex; flex-direction: column; gap: 1rem; align-items: center; }
      .readme-banner { border: 1px solid #8884; border-radius: .6rem; background: #8881; padding: .8rem 1rem; max-width: 44rem; }
      .readme-banner .readme { margin: 0; white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: .85rem; }
      .freespace { display: flex; flex-wrap: wrap; gap: 1rem; align-items: flex-start; justify-content: center; max-width: 60rem; }
      .cel {
        border: 1px solid #8884; border-radius: .6rem; background: #8881;
        padding: .6rem .8rem; cursor: pointer; min-width: 6rem; max-width: 22rem;
      }
      .cel:hover { background: #8882; }
      .cel.open { background: #8883; cursor: default; min-width: 20rem; }
      .cel .k { font-weight: 600; color: #888; margin-right: .5rem; font-family: ui-monospace, monospace; }
      .cel .v { font-family: ui-monospace, monospace; }
      .cel .readme, .cel .val { white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: .85rem; margin: .4rem 0; }
      .cel .entry { width: 100%; font: inherit; font-family: ui-monospace, monospace; padding: .35rem .5rem; margin-top: .4rem; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <a href="./os/" style="position:fixed;bottom:.6rem;right:.8rem;font-size:.75rem;opacity:.5;color:inherit">plastron-os ↗</a>
    <script type="module" src="./origin-main.ts"></script>
  </body>
</html>
